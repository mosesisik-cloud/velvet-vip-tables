server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600" always;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600" always;
        default_type application/xml;
        try_files $uri =404;
    }
    location ^~ /d/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ =404;
    }
    # MRZ OCR-B traineddata must be the raw gzip Tesseract.js fetches, not nginx-gunzipped.
    location ^~ /vendor/ {
        gzip off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # iPhone-PWA cachade kraschat JS. Skalet får aldrig heuristik-cachas.
    # Inte Service-Worker-Allowed / — det skulle låta SW ta hela b2b.bakemyday.se.
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(html|js|css|json|webmanifest)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
