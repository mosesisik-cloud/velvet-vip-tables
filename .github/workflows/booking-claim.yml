name: Claim restaurant booking task
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
jobs:
  claim:
    if: startsWith(github.event.comment.body, '/claim ') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const claim = require('./scripts/claim-booking.cjs');
            await claim({github, context, core});
