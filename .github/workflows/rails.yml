name: rails
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: node api/test-rails.mjs
      - run: node scripts/test-ux-navigation.mjs
      - run: node scripts/test-ux-booking.mjs
      - run: node scripts/test-discovery.mjs
      - run: node scripts/test-booking-selection.mjs
      - run: node scripts/test-booking-providers.mjs
      - run: node scripts/test-auth-options.mjs
      - run: node scripts/test-route-integrity.mjs
      - run: node scripts/test-restaurant-ids.mjs
      - run: node scripts/test-card-setup.mjs
      - run: node scripts/test-external-destinations.mjs
