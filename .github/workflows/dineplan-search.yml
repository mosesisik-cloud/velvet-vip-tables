name: Dineplan search qualification
on:
  push:
    paths:
      - 'scripts/lib/dineplan-*.mjs'
      - 'scripts/test-dineplan-*.mjs'
      - 'data/evidence/dineplan-*.json'
      - '.github/workflows/dineplan-search.yml'
  pull_request:
    paths:
      - 'scripts/lib/dineplan-*.mjs'
      - 'scripts/test-dineplan-*.mjs'
      - 'data/evidence/dineplan-*.json'
      - '.github/workflows/dineplan-search.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/test-dineplan-hussar-search.mjs scripts/test-dineplan-time-options.mjs
